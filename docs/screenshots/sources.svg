    <text x="606" y="113" font-size="12" fill="#6b7280">&#9660;</text>

    <text x="20" y="150" font-size="12.5" font-weight="600" fill="#6b7280">RESOURCE</text>
    <rect x="20" y="158" width="640" height="36" rx="8" fill="#ffffff" stroke="#e3e5e8"/>
    <text x="32" y="181" font-size="14" fill="#1a1d21">products</text>
    <text x="606" y="181" font-size="12" fill="#6b7280">&#9660;</text>

    <rect x="20" y="212" width="110" height="34" rx="8" fill="#16a37a"/>
