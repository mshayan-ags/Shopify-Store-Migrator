<svg viewBox="0 0 1280 560" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="1280" height="560" fill="#f6f6f7"/>

  <rect width="220" height="560" fill="#14151a"/>
  <circle cx="30" cy="34" r="5" fill="#16a37a"/>
  <text x="44" y="39" fill="#ffffff" font-size="15" font-weight="700">Store Migrator</text>
  <g font-size="14" fill="#cfd2d8">
